<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2540" />

    <!-- Title & Description -->
    <title>Chase Bank | Smart Banking & Credit Union</title>
    <meta
      name="description"
      content="Chase Bank offers secure, fast, and reliable banking solutions. Manage your finances, access loans, and grow your wealth with confidence."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chasecreditunion.online" />
    <meta property="og:title" content="Chase Bank" />
    <meta
      property="og:description"
      content="Secure and reliable financial services. Banking made simple with Chase Bank."
    />
    <meta property="og:image" content="https://chasecreditunion.online/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chasecreditunion.online" />
    <meta name="twitter:title" content="Chase Bank" />
    <meta
      name="twitter:description"
      content="Secure and reliable financial services. Banking made simple with Chase Bank."
    />
    <meta name="twitter:image" content="https://chasecreditunion.online/preview.png" />

    <!-- Optional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://chasecreditunion.online" />

    <!-- App Entry -->
    <script type="module" src="/src/index.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
